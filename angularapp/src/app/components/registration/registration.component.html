<div class="register-container">
    <h2>Registration</h2>
    <form (ngSubmit)="register()" #registerForm="ngForm">
        <!-- Username field -->
        <label for="username">Username:</label>
        <input 
            type="text" 
            id="username" 
            [(ngModel)]="user.Username" 
            name="username" 
            placeholder="Enter your username" 
            required 
            #usernameField="ngModel"
        >
        <div class="error-message" *ngIf="(registerForm.submitted && usernameField.invalid) || (usernameField.invalid && (usernameField.dirty || usernameField.touched))">
            Username is required.
        </div>

        <!-- Email field -->
        <label for="email">Email:</label>
        <input 
            type="email" 
            id="email" 
            [(ngModel)]="user.Email" 
            name="email" 
            placeholder="Enter your email" 
            required 
            #emailField="ngModel"
        >
        <div class="error-message" *ngIf="(registerForm.submitted && emailField.invalid) || (emailField.invalid && (emailField.dirty || emailField.touched))">
            A valid email is required.
        </div>

        <!-- Password field -->
        <label for="password">Password:</label>
        <input 
            type="password" 
            id="password" 
            [(ngModel)]="user.Password" 
            name="password" 
            placeholder="Enter your password" 
            required 
            #passwordField="ngModel"
        >
        <div class="error-message" *ngIf="(registerForm.submitted && passwordField.invalid) || (passwordField.invalid && (passwordField.dirty || passwordField.touched))">
            Password is required.
        </div>

        <!-- Confirm password field -->
        <label for="confirm-password">Confirm Password:</label>
        <input 
            type="password" 
            id="confirm-password" 
            [(ngModel)]="confirmPassword" 
            name="confirmPassword" 
            placeholder="Confirm your password" 
            required 
            #confirmPasswordField="ngModel"
        >
        <div class="error-message" *ngIf="(registerForm.submitted && confirmPasswordField.invalid) || (confirmPasswordField.invalid && (confirmPasswordField.dirty || confirmPasswordField.touched))">
            Confirm Password is required.
        </div>
    
    <div class="error-message" *ngIf="user.Password!=confirmPassword && (confirmPasswordField.dirty || confirmPasswordField.touched)"> 
 
     Passwords do not match 
 
    </div>

        <!-- Mobile number field -->
        <label for="mobile">Mobile Number:</label>
        <input 
            type="tel" 
            id="mobile" 
            [(ngModel)]="user.MobileNumber" 
            name="mobile" 
            placeholder="Enter your mobile number" 
            required 
            #mobileField="ngModel"
        >
        <div class="error-message" *ngIf="(registerForm.submitted && mobileField.invalid) || (mobileField.invalid && (mobileField.dirty || mobileField.touched))">
            Mobile Number is required.
        </div>

        <!-- Role dropdown field -->
        <label for="role">Role:</label>
        <select 
            id="role" 
            [(ngModel)]="user.UserRole" 
            name="role" 
            required
            #roleField="ngModel"
        >
            <option value="" disabled selected>Select a role</option>
            <option value="User">User</option>
            <option value="Admin">Admin</option>
        </select>
        <div class="error-message" *ngIf="(registerForm.submitted && roleField.invalid) || (roleField.invalid && (roleField.dirty || roleField.touched))">
            Role selection is required.
        </div>
        <div class="form-group" *ngIf="user.UserRole === 'Admin'">
            <label for="secretKey">Secret Key<span class="text-danger">*</span></label>
            <input type="password" id="secretKey" name="secretKey" [(ngModel)]="enteredkey" required #secretKeyNg="ngModel" class="form-control">
            <div *ngIf="(registerForm.submitted && secretKeyNg.invalid) || (secretKeyNg.invalid && (secretKeyNg.dirty || secretKeyNg.touched))" class="text-danger">
              Secret Key is required
            </div>
            </div>
        <!-- Submit button -->
        <button type="submit"  >Register</button>
    </form>
</div>
