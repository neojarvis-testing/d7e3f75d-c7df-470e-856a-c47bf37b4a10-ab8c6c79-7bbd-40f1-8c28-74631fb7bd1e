<div class="container mt-5">
  <h2 class="text-center mb-4">Hotel Rooms</h2>
  <div class="search-bar mb-4 text-center">
    <input type="text" class="form-control d-inline-block w-50" placeholder="Search by Hotel Name" [(ngModel)]="searchTerm" (ngModelChange)="searchByHotelName()" />
  </div>
  <div *ngIf="filteredTerm.length === 0" class="alert alert-warning" role="alert">
    No rooms found.
  </div>
  <div class="card-container">
    <div *ngFor="let room of paginatedRooms; let i = index" class="card">
      <img [src]="room.ImageUrl" alt="Room Image" />
      <div class="card-header">
        <div class="hotel-name">{{ room.HotelName }}</div>
        <div class="price">{{ room.PricePerNight | currency:'INR' }}</div>
      </div>
      <div class="card-content">
        <div class="card-details">
          <span class="icon">🛏️</span><strong class="small-bold">Room Type :</strong> {{ room.RoomType }}
        </div>
        <div class="card-details">
          <span class="icon">🚪</span><strong class="small-bold">No of Rooms :</strong> {{ room.NoOfRooms }}
        </div>
        <div class="card-details">
          <span class="icon">📍</span><strong class="small-bold">Location :</strong> {{ room.Location }}
        </div>
        <div class="card-details">
          <span class="icon">✔️</span><strong class="small-bold">Available :</strong> {{ room.IsAvailable ? 'Yes' : 'No' }}
        </div>
      </div>
      <div class="card-actions">
        <button class="btn btn-primary" (click)="edit(room.RoomId)">Edit</button>
        <button class="btn btn-danger" (click)="confirmDelete(room)">Delete</button>
      </div>
    </div>
  </div>
  <nav aria-label="Page navigation example" class="pagination-container mt-4">
    <ul class="pagination justify-content-center">
      <li class="page-item" *ngFor="let page of totalPagesArray" [class.active]="currentPage === page">
        <button class="page-link" (click)="changePage(page)">{{ page }}</button>
      </li>
    </ul>
  </nav>
</div>
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center">
        <p>Are you sure you want to delete this room?</p>
        <button class="btn btn-danger" (click)="deleteRoom()" data-bs-dismiss="modal">Yes, Delete</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      </div>
    </div>
  </div>
</div>
