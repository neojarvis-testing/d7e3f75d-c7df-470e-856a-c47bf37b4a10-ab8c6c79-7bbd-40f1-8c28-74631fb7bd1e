<div class="login-container">
    <h2>Login</h2>
    <form (ngSubmit)="login()" #loginForm="ngForm">
        <label for="username">Username:</label>
        <input 
            type="text" 
            id="username" 
            [(ngModel)]="user.Email" 
            name="username" 
            placeholder="Enter your username" 
            required
            #usernameField="ngModel"
        >
        <div *ngIf="usernameField.touched && usernameField.dirty && usernameField.invalid" class="error">
            Username is required.
        </div>

        <label for="password">Password:</label>
        <input 
            type="password" 
            id="password" 
            [(ngModel)]="user.Password" 
            name="password" 
            placeholder="Enter your password" 
            required
            #passwordField="ngModel"
        >
        <div *ngIf="passwordField.touched && passwordField.dirty && passwordField.invalid" class="error">
            Password is required.
        </div>

        <button type="submit" [disabled]="loginForm.invalid">Login</button>
    </form>
    <p>
        Don't have an account? 
        <a (click)="register()">Register here</a>
    </p>
</div>
