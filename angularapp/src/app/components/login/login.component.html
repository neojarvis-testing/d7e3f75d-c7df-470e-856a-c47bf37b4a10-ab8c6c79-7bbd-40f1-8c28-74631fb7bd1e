<div class="login-container">
    <h2>Login</h2>
    <form (ngSubmit)="login()" #loginForm="ngForm">
        <label for="username">Username:</label>
        <input 
            type="text" 
            id="username" 
            [(ngModel)]="user.Email" 
            name="username" 
            placeholder="Enter your username" 
            required
            #usernameField="ngModel"
        >
        <!-- Error message for username -->
        <div *ngIf="(loginForm.submitted && usernameField.invalid) || (usernameField.invalid && (usernameField.dirty || usernameField.touched))" class="error">

            Username is required.
        </div>

        <label for="password">Password:</label>
        <input 
            type="password" 
            id="password" 
            [(ngModel)]="user.Password" 
            name="password" 
            placeholder="Enter your password" 
            required
            #passwordField="ngModel"
        >
        <!-- Error message for password -->
        <div *ngIf="(loginForm.submitted && passwordField.invalid) || (passwordField.invalid && (passwordField.dirty || passwordField.touched))" class="error">

            Password is required.
        </div>

        <button type="submit">Login</button>
    </form>
    <p>
        Don't have an account? 
        <a (click)="register()">Register here</a>
    </p>
</div>
