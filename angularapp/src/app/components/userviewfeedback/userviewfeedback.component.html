  <!-- Confirmation Pop-up for Deleting Feedback -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center">
          <p>Are you sure you want to delete this feedback?</p>
          <button class="btn btn-danger" (click)="deleteFeedback()" data-bs-dismiss="modal">Yes, Delete</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </div>
    </div>
  </div>

   <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 text-center">
        <h2 class="fw-bold mb-4" style="color: #08374d;">My Feedback</h2>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card-container">
          <div class="card" *ngFor="let feedback of paginatedFeedbacks; let i = index">
            <div class="card-header">
              <span>S.No. {{ (currentPage - 1) * itemsPerPage + i + 1 }}</span>
              <button class="btn btn-danger btn-sm" (click)="confirmDelete(feedback)">Delete</button>
            </div>
            <div class="card-content">
              <p>{{ feedback.FeedbackText }}</p>
            </div>
          </div>
        </div>
        <div class="pagination-container">
          <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
              <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" (click)="changePage(currentPage - 1)">Previous</a>
              </li>
              <li class="page-item" *ngFor="let page of totalPagesArray" [class.active]="page === currentPage">
                <a class="page-link" (click)="changePage(page)">{{ page }}</a>
              </li>
              <li class="page-item" [class.disabled]="currentPage === totalPagesArray.length">
                <a class="page-link" (click)="changePage(currentPage + 1)">Next</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </div>
