<div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 text-center">
        <h2 class="fw-bold mb-4" style="color: #08374d;">My Feedback</h2>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-8">
        <table class="table table-bordered table-striped table-center">
          <thead>
            <tr>
              <th>S.No.</th>
              <th>Feedback</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody class="table_body">
            <tr *ngFor="let feedback of feedbacks; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ feedback.FeedbackText }}</td>
              <td>
                <button class="btn btn-danger btn-sm" (click)="confirmDelete(feedback)">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  
  <!-- Confirmation Pop-up for Deleting Feedback -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center">
          <p>Are you sure you want to delete this feedback?</p>
          <button class="btn btn-danger" (click)="deleteFeedback()" data-bs-dismiss="modal">Yes, Delete</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </div>
    </div>
  </div>
